"出尔反尔":{breakdown:[{zh:"出尔",m:"what comes from you"},{zh:"反尔",m:"returns against you"}],literal:"What comes from you comes back against you",derivation:"From Mencius — your own words turn against you; you contradict yourself or break your word",note:"出自《孟子》。The original line is 出乎尔者，反乎尔者 — what you send out returns to you. Originally a warning about political karma, not merely personal inconsistency."},
"出类拔萃":{breakdown:[{zh:"出类",m:"stand out from the group"},{zh:"拔萃",m:"rise above the crowd"}],literal:"Stand out from the group, rise above the rest",derivation:"Excel so far beyond peers that you are in a class of your own"},
"出人头地":{breakdown:[{zh:"出人",m:"surpass others"},{zh:"头地",m:"by a head's height"}],literal:"Surpass others by a head's height",derivation:"Rise above your peers — Su Shi's phrase meaning to excel by a noticeable margin"},
"吹毛求疵":{breakdown:[{zh:"吹毛",m:"blow apart the fur"},{zh:"求疵",m:"search for flaws"}],literal:"Blow the fur apart to look for blemishes",derivation:"Go out of your way to find tiny faults — nitpicking for the sake of fault-finding"},
"垂涎三尺":{breakdown:[{zh:"垂涎",m:"drool"},{zh:"三尺",m:"three feet (exaggeration)"}],literal:"Drooling three feet long",derivation:"Extreme desire — so covetous that saliva flows uncontrollably"},
"唇亡齿寒":{breakdown:[{zh:"唇亡",m:"lips are gone"},{zh:"齿寒",m:"teeth feel cold"}],literal:"Without lips, the teeth grow cold",derivation:"Two things so interdependent that when one fails, the other immediately suffers"},
"粗制滥造":{breakdown:[{zh:"粗制",m:"roughly made"},{zh:"滥造",m:"carelessly mass-produced"}],literal:"Roughly made and carelessly mass-produced",derivation:"Prioritising quantity over quality — shoddy work turned out without care"},
"打草惊蛇":{breakdown:[{zh:"打草",m:"beat the grass"},{zh:"惊蛇",m:"startle the snake"}],literal:"Beat the grass and startle the snake hiding in it",derivation:"Act carelessly and alert the very enemy you are trying to catch off-guard",note:"唐代典故。Traced to Tang dynasty magistrate Wang Lu, who while judging a bribery case realised the accusation pointed at himself — he wrote: 你虽打草，我已惊蛇."},
"大公无私":{breakdown:[{zh:"大公",m:"completely public-minded"},{zh:"无私",m:"without selfishness"}],literal:"Wholly for the public good, with no private interest",derivation:"Act entirely for the collective benefit with no personal agenda"},
"大言不惭":{breakdown:[{zh:"大言",m:"boastful words"},{zh:"不惭",m:"without shame"}],literal:"Speak boastfully without shame",derivation:"Brag shamelessly — say grand things about yourself without embarrassment"},
"当机立断":{breakdown:[{zh:"当机",m:"at the critical moment"},{zh:"立断",m:"decide immediately"}],literal:"At the critical moment, decide immediately",derivation:"When the time is right, act decisively without hesitation"},
"当仁不让":{breakdown:[{zh:"当仁",m:"when faced with a righteous duty"},{zh:"不让",m:"do not defer"}],literal:"When faced with a righteous duty, do not step aside",derivation:"From Confucius — even before your teacher, do not yield when you know something is right"},
"德高望重":{breakdown:[{zh:"德高",m:"virtue is high"},{zh:"望重",m:"reputation is weighty"}],literal:"Virtue is high, reputation is weighty",derivation:"A person of great moral character who commands wide respect"},
"得过且过":{breakdown:[{zh:"得过",m:"able to get by"},{zh:"且过",m:"just let it pass"}],literal:"If you can get by, just let it pass",derivation:"Do the bare minimum to scrape through — no ambition to improve"},
"得意忘形":{breakdown:[{zh:"得意",m:"pleased / triumphant"},{zh:"忘形",m:"forget one's proper bearing"}],literal:"So pleased that you forget your proper bearing",derivation:"Become so carried away with success that you lose self-control"},
"雕虫小技":{breakdown:[{zh:"雕虫",m:"carving tiny insects"},{zh:"小技",m:"minor skill"}],literal:"The petty skill of carving tiny insects",derivation:"Originally about ornate but trivial calligraphy — now any insignificant or showy skill"},
"掉以轻心":{breakdown:[{zh:"掉以",m:"treat with"},{zh:"轻心",m:"a careless heart"}],literal:"Treat something with a careless heart",derivation:"Be complacent about something that deserves serious attention"},
"东窗事发":{breakdown:[{zh:"东窗",m:"east window (of a conspirator's study)"},{zh:"事发",m:"the matter is exposed"}],literal:"The east-window plot is revealed",derivation:"From Song traitor Qin Hui who plotted treason by his east window — his scheme was eventually uncovered",note:"出自秦桧的故事。Qin Hui (秦桧) is one of Chinese history's most reviled villains — he framed the patriot Yue Fei. His ghost reportedly said 东窗事发矣 in his wife's dream after his death."},
"东山再起":{breakdown:[{zh:"东山",m:"East Mountain"},{zh:"再起",m:"rise again"}],literal:"Rise again from East Mountain",derivation:"From Xie An who retired to East Mountain then returned to power — make a successful comeback",note:"出自谢安的故事。The idiom is inherently optimistic — it is always used of someone who will succeed in their comeback, not merely attempt one."},
"独善其身":{breakdown:[{zh:"独善",m:"cultivate only"},{zh:"其身",m:"one's own self"}],literal:"Cultivate only your own self",derivation:"From Mencius — in poverty, keep yourself virtuous. Now often used negatively (selfish)",note:"出自《孟子》，有正负两层含义。Positive: when you cannot help the world, at least perfect yourself. Negative (modern): selfishly only looking after number one. Context determines the reading."},
"对牛弹琴":{breakdown:[{zh:"对牛",m:"facing a cow"},{zh:"弹琴",m:"play the qin zither"}],literal:"Play beautiful music to a cow",derivation:"The cow cannot appreciate the music — waste effort on the wrong audience"},
"对症下药":{breakdown:[{zh:"对症",m:"matched to the symptoms"},{zh:"下药",m:"prescribe medicine"}],literal:"Prescribe medicine that matches the symptoms",derivation:"Address the root of a problem with targeted, appropriate action"},
"多多益善":{breakdown:[{zh:"多多",m:"more and more"},{zh:"益善",m:"all the better"}],literal:"The more, the better",derivation:"From Han Xin's famous reply to Emperor Liu Bang — the more troops, the more advantageous"},
"耳濡目染":{breakdown:[{zh:"耳濡",m:"ears soaked"},{zh:"目染",m:"eyes stained"}],literal:"Ears soaked, eyes stained",derivation:"Constant exposure absorbs into you — unconsciously influenced by surroundings"},
"发人深省":{breakdown:[{zh:"发人",m:"stir people"},{zh:"深省",m:"deep reflection"}],literal:"Stir people into deep reflection",derivation:"Something so profound it prompts serious thought and new insight"},
"发扬光大":{breakdown:[{zh:"发扬",m:"carry forward"},{zh:"光大",m:"make glorious and great"}],literal:"Carry forward and make glorious",derivation:"Take what is good and expand and elevate it further"},
"防患未然":{breakdown:[{zh:"防患",m:"prevent disaster"},{zh:"未然",m:"before it has happened"}],literal:"Prevent disaster before it occurs",derivation:"Take precautions while things are still safe"},
"废寝忘食":{breakdown:[{zh:"废寝",m:"neglect sleep"},{zh:"忘食",m:"forget to eat"}],literal:"Neglect sleep, forget to eat",derivation:"So absorbed in what you are doing that basic needs are forgotten"},
"分庭抗礼":{breakdown:[{zh:"分庭",m:"divide the courtyard"},{zh:"抗礼",m:"exchange equal courtesies"}],literal:"Stand on opposite sides of the courtyard and bow as equals",derivation:"Originally a formal equal-standing ritual — now to rival someone as a peer"},
"纷至沓来":{breakdown:[{zh:"纷至",m:"arrive in great numbers"},{zh:"沓来",m:"come in a continuous stream"}],literal:"Arrive in great numbers, come in a continuous stream",derivation:"People or things keep coming without pause"},
"奉公守法":{breakdown:[{zh:"奉公",m:"serve the public good"},{zh:"守法",m:"abide by the law"}],literal:"Serve the public and abide by the law",derivation:"Conduct yourself with integrity — follow rules and put the public interest first"},
"敷衍塞责":{breakdown:[{zh:"敷衍",m:"go through the motions"},{zh:"塞责",m:"plug one's responsibility superficially"}],literal:"Go through the motions to plug the gap of responsibility",derivation:"Do just enough to appear to have done your job without genuine effort"},
"赴汤蹈火":{breakdown:[{zh:"赴汤",m:"plunge into boiling water"},{zh:"蹈火",m:"tread through fire"}],literal:"Plunge into boiling water, tread through fire",derivation:"Face the most extreme dangers without flinching"},
"改过自新":{breakdown:[{zh:"改过",m:"correct one's mistakes"},{zh:"自新",m:"renew oneself"}],literal:"Correct your mistakes and renew yourself",derivation:"Genuinely reform — change your ways and start fresh"},
"改邪归正":{breakdown:[{zh:"改邪",m:"give up the crooked path"},{zh:"归正",m:"return to the right path"}],literal:"Leave the crooked path, return to the straight one",derivation:"Abandon wrongdoing and return to an honest way of life"},
"高瞻远瞩":{breakdown:[{zh:"高瞻",m:"look from a high vantage point"},{zh:"远瞩",m:"gaze far into the distance"}],literal:"Look from high up, gaze far ahead",derivation:"Have foresight and breadth of vision — think long-term and strategically"},
"高枕无忧":{breakdown:[{zh:"高枕",m:"high pillow — sleep comfortably"},{zh:"无忧",m:"without worries"}],literal:"Sleep on a high pillow without worries",derivation:"Feel completely at ease — sometimes critically: dangerously complacent"},
"各有千秋":{breakdown:[{zh:"各有",m:"each has"},{zh:"千秋",m:"a thousand autumns (enduring value)"}],literal:"Each has its own thousand autumns",derivation:"Each has its own lasting merits — different but equally worthy"},
"根深蒂固":{breakdown:[{zh:"根深",m:"roots deep"},{zh:"蒂固",m:"stem firmly attached"}],literal:"Deep roots, firmly attached stem",derivation:"So deeply entrenched — a belief or habit — that it is very hard to change"},
"勾心斗角":{breakdown:[{zh:"勾心",m:"hook into each other's minds"},{zh:"斗角",m:"butt corners against each other"}],literal:"Hooks into minds, horns locked against each other",derivation:"Originally described interlocking palace eaves; now means scheming against each other",note:"出自杜牧《阿房宫赋》，原为建筑美学词汇。Originally described the interlocking eaves of the Epang Palace — a purely aesthetic term. The modern meaning (scheming) is a complete semantic reversal."},
"苟且偷安":{breakdown:[{zh:"苟且",m:"muddle along"},{zh:"偷安",m:"steal temporary comfort"}],literal:"Muddle along and steal temporary comfort",derivation:"Live for short-term ease without caring about the future"},
"孤陋寡闻":{breakdown:[{zh:"孤陋",m:"narrow and shallow knowledge"},{zh:"寡闻",m:"little heard"}],literal:"Narrow learning, little heard",derivation:"Ignorant through isolation — having seen and learned too little of the wider world"},
"沽名钓誉":{breakdown:[{zh:"沽名",m:"peddle a name"},{zh:"钓誉",m:"fish for praise"}],literal:"Peddle a name and fish for praise",derivation:"Use dishonest means to cultivate a reputation — seeking fame one has not genuinely earned"},
"孤掌难鸣":{breakdown:[{zh:"孤掌",m:"a single palm"},{zh:"难鸣",m:"hard to clap"}],literal:"One palm alone cannot clap",derivation:"You cannot accomplish anything significant alone — you need others' cooperation"},
"孤注一掷":{breakdown:[{zh:"孤注",m:"one's last stake (in gambling)"},{zh:"一掷",m:"a single throw"}],literal:"Stake everything on one throw",derivation:"Bet all remaining resources on a single desperate attempt"},
"寡不敌众":{breakdown:[{zh:"寡",m:"few"},{zh:"不敌",m:"cannot match"},{zh:"众",m:"the many"}],literal:"The few cannot match the many",derivation:"Hopelessly outnumbered — resistance is futile"},
"管中窥豹":{breakdown:[{zh:"管中",m:"through a tube"},{zh:"窥豹",m:"peek at a leopard"}],literal:"Peek at a leopard through a tube — see only one spot",derivation:"A partial glimpse that gives only a tiny fragment of the whole picture",note:"有两种解读。Two valid interpretations: (1) negative: you only see part of the whole; (2) positive (可见一斑): from one spot you infer the whole. The Singapore curriculum uses the negative reading."},
"光明正大":{breakdown:[{zh:"光明",m:"bright / transparent"},{zh:"正大",m:"upright and proper"}],literal:"Bright and upright",derivation:"Act openly and honestly with nothing to hide"},
"海底捞针":{breakdown:[{zh:"海底",m:"ocean floor"},{zh:"捞针",m:"fish out a needle"}],literal:"Fish a needle from the ocean floor",derivation:"An almost impossible search — tiny object, vast space"},
"海誓山盟":{breakdown:[{zh:"海誓",m:"oath sworn by the sea"},{zh:"山盟",m:"vow pledged by the mountains"}],literal:"Oaths by the sea, vows by the mountains",derivation:"The sea and mountains are eternal — your love or promise will last just as long"},
"害群之马":{breakdown:[{zh:"害群",m:"harm the herd"},{zh:"之马",m:"the horse that..."}],literal:"The horse that harms the herd",derivation:"One bad member whose behaviour damages the entire group"},
"含沙射影":{breakdown:[{zh:"含沙",m:"hold sand in mouth"},{zh:"射影",m:"spit at a shadow"}],literal:"Hold sand and spit at someone's shadow",derivation:"From a mythical creature that harms people by spitting at their reflection — attack or slander indirectly"},
"汗牛充栋":{breakdown:[{zh:"汗牛",m:"oxen sweat from the weight"},{zh:"充栋",m:"fill up to the roof beams"}],literal:"So many books the oxen sweat; stacked to the rafters",derivation:"An enormous collection of books",note:"专指书籍，不可用于其他物品。This idiom applies ONLY to books — using it for other objects is incorrect. A common student error."},
"好逸恶劳":{breakdown:[{zh:"好逸",m:"love ease"},{zh:"恶劳",m:"hate labour"}],literal:"Love ease, hate labour",derivation:"Always seeking the comfortable path and avoiding hard work"},
"狐假虎威":{breakdown:[{zh:"狐假",m:"the fox borrows"},{zh:"虎威",m:"the tiger's fearsome power"}],literal:"The fox borrows the tiger's ferocity",derivation:"From a fable — the fox walks behind the tiger and all animals flee (from the tiger, not the fox). Bully others by trading on a powerful backer's authority"},
"胡作非为":{breakdown:[{zh:"胡作",m:"act recklessly"},{zh:"非为",m:"wrongful deeds"}],literal:"Act recklessly and commit wrongful deeds",derivation:"Behave outrageously with no regard for law or consequences"},
"花言巧语":{breakdown:[{zh:"花言",m:"flowery words"},{zh:"巧语",m:"clever speech"}],literal:"Flowery words and clever speech",derivation:"Sweet-sounding language designed to deceive — pretty on the surface but dishonest"},
"画龙点睛":{breakdown:[{zh:"画龙",m:"paint the dragon"},{zh:"点睛",m:"dot in the eyes"}],literal:"Paint the dragon, then dot in its eyes",derivation:"From a story of a painter whose dragons came alive when he added their eyes — a final touch that brings everything to life"},
"画蛇添足":{breakdown:[{zh:"画蛇",m:"draw a snake"},{zh:"添足",m:"add feet"}],literal:"Draw a snake, then add feet to it",derivation:"From a contest: the winner added unnecessary feet and lost. Do more than needed and ruin what was already perfect"},
"诲人不倦":{breakdown:[{zh:"诲人",m:"instruct people"},{zh:"不倦",m:"without weariness"}],literal:"Teach and guide people without ever tiring",derivation:"From Confucius describing himself — endless patience and dedication in guiding others"},
"混水摸鱼":{breakdown:[{zh:"混水",m:"muddy the water"},{zh:"摸鱼",m:"grope for fish"}],literal:"Muddy the water, then grope for fish",derivation:"Fish are easier to catch in murky water — create confusion to gain an unfair advantage"},
"疾风知劲草":{breakdown:[{zh:"疾风",m:"fierce wind"},{zh:"知",m:"reveals"},{zh:"劲草",m:"tough resilient grass"}],literal:"A fierce wind reveals which grass is truly tough",derivation:"Crisis reveals who has genuine strength of character"},
"家喻户晓":{breakdown:[{zh:"家喻",m:"every household understands"},{zh:"户晓",m:"every door knows"}],literal:"Every household understands, every door knows",derivation:"So widely known that not a single family is unaware"},
"假公济私":{breakdown:[{zh:"假公",m:"under the guise of public duty"},{zh:"济私",m:"benefit private interests"}],literal:"Use the public as cover to benefit oneself privately",derivation:"Exploit an official position for personal gain while pretending to serve the collective"},
"见仁见智":{breakdown:[{zh:"见仁",m:"the benevolent sees benevolence"},{zh:"见智",m:"the wise sees wisdom"}],literal:"The kind-hearted see kindness; the wise see wisdom",derivation:"From the I Ching — different people interpret the same thing differently",note:"出自《易经》，中性词。This is a NEUTRAL idiom — it does not imply one view is right. Students sometimes misuse it with negative connotation; the original sense is that different natures simply perceive differently."},
"见义勇为":{breakdown:[{zh:"见义",m:"see what is righteous"},{zh:"勇为",m:"bravely act"}],literal:"See what is right, and act on it bravely",derivation:"Do not hesitate when you witness an injustice — step up courageously"},
"捷足先登":{breakdown:[{zh:"捷足",m:"nimble feet"},{zh:"先登",m:"arrive first"}],literal:"Swift feet arrive first",derivation:"The one who acts fastest gets there first — speed determines success"},
"解铃还须系铃人":{breakdown:[{zh:"解铃",m:"untie the bell"},{zh:"还须",m:"must be done by"},{zh:"系铃人",m:"the one who tied it"}],literal:"Only the one who tied the bell can untie it",derivation:"From a Chan Buddhist riddle — whoever created the problem is best placed to resolve it"},
"金科玉律":{breakdown:[{zh:"金科",m:"golden rule"},{zh:"玉律",m:"jade regulation"}],literal:"Golden rules and jade regulations",derivation:"Gold and jade are most precious — rules so perfect they cannot be questioned"},
"金玉良言":{breakdown:[{zh:"金玉",m:"gold and jade"},{zh:"良言",m:"good words"}],literal:"Gold-and-jade words",derivation:"Advice so precious it is worth its weight in gold and jade"},
"近水楼台":{breakdown:[{zh:"近水",m:"close to the water"},{zh:"楼台",m:"pavilion"}],literal:"The pavilion closest to the water catches moonlight first",derivation:"Those in proximity naturally gain the first opportunity",note:"出自宋诗，全句为：近水楼台先得月，向阳花木易为春。The full line: the pavilion near water catches moonlight first; flowers facing the sun bloom more easily in spring. Often used with mild irony."},
"进退维谷":{breakdown:[{zh:"进退",m:"advance or retreat"},{zh:"维谷",m:"both are valleys (dead ends)"}],literal:"Whether advancing or retreating, you are in a valley",derivation:"Trapped — every direction leads to difficulty"},
"近朱者赤，近墨者黑":{breakdown:[{zh:"近朱者赤",m:"those near vermillion turn red"},{zh:"近墨者黑",m:"those near ink turn black"}],literal:"Near red dye and you turn red; near ink and you turn black",derivation:"Your environment shapes your character — good company improves you, bad company corrupts you"},
"惊弓之鸟":{breakdown:[{zh:"惊弓",m:"startled by a bowstring"},{zh:"之鸟",m:"the bird that was"}],literal:"A bird once startled by a bowstring",derivation:"From a story of an archer who brought down a bird merely by twanging his bow — it panicked at the sound alone. Someone traumatised by past experience"},
"井井有条":{breakdown:[{zh:"井井",m:"orderly (reduplicated for emphasis)"},{zh:"有条",m:"has order"}],literal:"Orderly and systematic in every way",derivation:"Everything arranged neatly and methodically"},
"咎由自取":{breakdown:[{zh:"咎",m:"blame / fault"},{zh:"由自取",m:"brought upon oneself"}],literal:"The blame is something you brought upon yourself",derivation:"You caused the problem — no one else is responsible for the consequences"},
"居安思危":{breakdown:[{zh:"居安",m:"dwelling in safety"},{zh:"思危",m:"think of danger"}],literal:"When living in safety, think of danger",derivation:"Do not become complacent in good times — always prepare for circumstances to change"},
"鞠躬尽瘁":{breakdown:[{zh:"鞠躬",m:"bow humbly"},{zh:"尽瘁",m:"exhaust every last effort"}],literal:"Bow humbly and exhaust every last effort",derivation:"From Zhuge Liang's memorial — devote yourself completely to duty until you have nothing left"},
"举足轻重":{breakdown:[{zh:"举足",m:"lift a foot / make a move"},{zh:"轻重",m:"affects the balance"}],literal:"Every step you take tips the scales",derivation:"Occupy such a pivotal position that your slightest action affects the entire outcome"},
"开门见山":{breakdown:[{zh:"开门",m:"open the door"},{zh:"见山",m:"immediately see the mountain"}],literal:"Open the door and the mountain is right there",derivation:"Get straight to the point — the main subject from the very first moment"},
"开源节流":{breakdown:[{zh:"开源",m:"open new sources of income"},{zh:"节流",m:"reduce the flow of expenditure"}],literal:"Open new sources, reduce the outflow",derivation:"The two-pronged approach to financial health — earn more and spend less"},
"慷慨解囊":{breakdown:[{zh:"慷慨",m:"generous"},{zh:"解囊",m:"open one's purse"}],literal:"Generously open one's purse",derivation:"Give money freely and without hesitation to help others"},
"口若悬河":{breakdown:[{zh:"口若",m:"mouth like"},{zh:"悬河",m:"a river cascading from a height"}],literal:"A mouth like a river pouring down a cliff",derivation:"Words flow in an unstoppable torrent — extremely eloquent, never at a loss for words"},
"口是心非":{breakdown:[{zh:"口是",m:"mouth says yes"},{zh:"心非",m:"heart says no"}],literal:"The mouth agrees, the heart disagrees",derivation:"Say one thing while meaning another — dishonesty between expression and inner intention"},
"苦口婆心":{breakdown:[{zh:"苦口",m:"bitter words (hard to hear)"},{zh:"婆心",m:"a grandmother's kindly heart"}],literal:"Harsh words from a grandmother's loving heart",derivation:"Advise someone repeatedly out of genuine care — the words may be hard to hear but the intention is loving"},
"苦心孤诣":{breakdown:[{zh:"苦心",m:"painstaking effort"},{zh:"孤诣",m:"attain where others cannot"}],literal:"Through painstaking solitary effort, reach where others cannot",derivation:"Achieve mastery through years of dedicated toil that others are unwilling to match"},
"滥竽充数":{breakdown:[{zh:"滥竽",m:"unqualified yu-flute player"},{zh:"充数",m:"make up the numbers"}],literal:"A fake yu-flute player filling a seat in the orchestra",derivation:"From the story of Nan Guo who pretended to play in the royal ensemble — pass yourself off as qualified when you have no real skill",note:"竽是一种管乐器，需合奏。The yu (竽) was a mouth organ played in ensembles of hundreds. King Xuan demanded ensemble playing so individual mediocrity was hidden. King Min preferred solos — Nan Guo fled. A commentary on systems that reward conformity over ability."},
"狼狈为奸":{breakdown:[{zh:"狼狈",m:"wolf and bei — each relies on the other's legs"},{zh:"为奸",m:"conspire to do evil"}],literal:"Wolf and bei conspire together to do evil",derivation:"The mythical 狈 had short forelegs and rested them on a wolf's back — interdependent wrongdoing; each enables the other's crime",note:"狈是传说中的神兽，前腿极短，需依附狼才能行走。The 狈 (bèi) is a mythological creature physically dependent on the wolf. Partners in crime who literally cannot function without each other."},
"老马识途":{breakdown:[{zh:"老马",m:"old horse"},{zh:"识途",m:"knows the road"}],literal:"An old horse knows the road",derivation:"From Duke Huan of Qi who used an old horse to find the way home — experience is an invaluable guide"},
"礼尚往来":{breakdown:[{zh:"礼尚",m:"in etiquette, value"},{zh:"往来",m:"give and take"}],literal:"In etiquette, reciprocity is prized",derivation:"Social harmony depends on mutual courtesy — kindness should be returned"},
"理直气壮":{breakdown:[{zh:"理直",m:"reasoning is correct"},{zh:"气壮",m:"spirit is bold"}],literal:"Reasoning straight, spirit bold",derivation:"When you know you are right, you speak with confidence — righteousness gives you strength"},
"力不从心":{breakdown:[{zh:"力",m:"strength / ability"},{zh:"不从心",m:"does not follow the heart's wish"}],literal:"One's strength does not follow one's heart",derivation:"The spirit is willing but capacity falls short of what you want to do"},
"立竿见影":{breakdown:[{zh:"立竿",m:"stand up a pole"},{zh:"见影",m:"immediately see its shadow"}],literal:"Stand up a pole and immediately see its shadow",derivation:"Results appear instantly — as certain as a shadow appearing when sunlight hits a pole"},
"励精图治":{breakdown:[{zh:"励精",m:"invigorate the spirit"},{zh:"图治",m:"plan for good governance"}],literal:"Invigorate the spirit and plan for good rule",derivation:"A ruler who energetically devotes himself to improving governance"},
"良药苦口":{breakdown:[{zh:"良药",m:"good medicine"},{zh:"苦口",m:"bitter to the mouth"}],literal:"Good medicine tastes bitter",derivation:"Honest, helpful advice is uncomfortable to hear — like effective medicine being bitter"},
"良莠不齐":{breakdown:[{zh:"良",m:"good grain"},{zh:"莠",m:"foxtail weed (mimics grain)"},{zh:"不齐",m:"unevenly mixed"}],literal:"Good grain and weeds growing unevenly mixed",derivation:"Good and bad people intermingled — hard to tell apart because the weeds mimic the grain",note:"莠是狗尾草，幼苗与庄稼极为相似。莠 (yǒu) is specifically foxtail grass — it closely mimics wheat when young, making it notoriously hard to separate from the real crop. The agricultural precision of this metaphor matters."},
"两袖清风":{breakdown:[{zh:"两袖",m:"both sleeves"},{zh:"清风",m:"nothing but a clean breeze"}],literal:"Both sleeves hold nothing but a clean breeze",derivation:"An official who has taken no bribes — so incorruptible his sleeves are empty, carrying only air"},
"了如指掌":{breakdown:[{zh:"了如",m:"understand as clearly as"},{zh:"指掌",m:"looking at one's own palm"}],literal:"Know it as clearly as the lines on your own palm",derivation:"From Confucius on ritual — understand something so thoroughly it is as familiar as your own hand"},
"临渴掘井":{breakdown:[{zh:"临渴",m:"when already thirsty"},{zh:"掘井",m:"start digging a well"}],literal:"Start digging a well only when you are already thirsty",derivation:"Act only when the crisis has arrived — too little, too late"},
"炉火纯青":{breakdown:[{zh:"炉火",m:"furnace fire"},{zh:"纯青",m:"pure blue (the hottest flame)"}],literal:"The furnace fire burns pure blue",derivation:"Alchemists knew pure blue flame meant perfection — skill so refined it has reached absolute mastery",note:"源自道教炼丹术。The flame colour sequence: red → yellow → white → blue. Pure blue (纯青) indicates the highest temperature and most refined state. A Daoist alchemical term for reaching the pinnacle of a long, careful process."},
"路不拾遗":{breakdown:[{zh:"路不",m:"on the road, no one"},{zh:"拾遗",m:"picks up lost items"}],literal:"On the road, no one picks up what others have dropped",derivation:"A society so honest that even valuables on the road are untouched"},
"落花流水":{breakdown:[{zh:"落花",m:"fallen petals"},{zh:"流水",m:"flowing water carrying them away"}],literal:"Fallen petals swept away by flowing water",derivation:"A scene of utter devastation and rout — the defeated side scattered and washed away"},
"洛阳纸贵":{breakdown:[{zh:"洛阳",m:"Luoyang (ancient capital)"},{zh:"纸贵",m:"paper became expensive"}],literal:"Paper in Luoyang became expensive",derivation:"From Zuo Si's rhapsody — so many people copied it that paper prices rose. A work so popular it spreads wildfire",note:"左思花了十年写成《三都赋》。Zuo Si spent TEN YEARS writing 《三都赋》. The fame was genuinely hard-won — the idiom carries the weight of that dedication."},
"络绎不绝":{breakdown:[{zh:"络绎",m:"continuous / linked together"},{zh:"不绝",m:"without cease"}],literal:"Linked together without cease",derivation:"A stream of people or things passing continuously — never a gap"},
"毛遂自荐":{breakdown:[{zh:"毛遂",m:"Mao Sui (a person's name)"},{zh:"自荐",m:"recommend oneself"}],literal:"Mao Sui recommends himself",derivation:"Mao Sui stepped forward when Lord Pingyuan could only find 19 worthy men for a 20-person mission — proved indispensable",note:"毛遂对平原君说：请君以遂为囊中之锥。Mao Sui said: 'Put me in the bag today.' Lord Pingyuan doubted him ('an awl in a bag shows its tip — yours hasn't shown'). Mao Sui single-handedly secured the alliance."},
"每况愈下":{breakdown:[{zh:"每况",m:"with each passing situation"},{zh:"愈下",m:"increasingly worse"}],literal:"With each situation, increasingly worse",derivation:"Steady, unrelenting decline — things get worse with every period"},
"门可罗雀":{breakdown:[{zh:"门可",m:"at the gate, one could"},{zh:"罗雀",m:"set nets to catch sparrows"}],literal:"So few visitors you could set sparrow-nets at the gate",derivation:"From Sima Qian's account of a fallen official whose gate became so quiet that birds nested there",note:"出自《史记》，写郑当时失势后门前冷落。The contrast in the original is powerful: at his peak, visitors crowded his gate; after his fall, you could net sparrows there. A lesson on fair-weather followers."},
"面目全非":{breakdown:[{zh:"面目",m:"appearance"},{zh:"全非",m:"completely other than it was"}],literal:"The appearance is completely other than it was",derivation:"Changed so drastically that the original is unrecognisable"},
"名列前茅":{breakdown:[{zh:"名列",m:"name ranked"},{zh:"前茅",m:"at the front reeds"}],literal:"Name ranked among the front reeds",derivation:"Ancient armies used reeds as vanguard markers — to be at the front means top performance"},
"名落孙山":{breakdown:[{zh:"名落",m:"name falls"},{zh:"孙山",m:"below Sun Shan (a person's name)"}],literal:"Your name falls below Sun Shan's",derivation:"From a story: Sun Shan came last but passed — anyone below him failed. Fall just short and not make the cut",note:"孙山是宋代故事中的人物，以婉转方式告知落榜。Sun Shan's verse was a kind way to deliver bad news. An elegant example of tactful communication in Chinese culture."},
"墨守成规":{breakdown:[{zh:"墨守",m:"Mozi's defensive stubbornness"},{zh:"成规",m:"established rules"}],literal:"Guard conventions as stubbornly as Mozi defended a city",derivation:"Mozi was famous for tenaciously defending positions — rigidly clinging to old rules, refusing to adapt",note:"注意：墨指墨子，非墨水！墨 refers to MOZI (墨子), the philosopher — NOT ink (墨水). A very common student misreading. Mozi's famous defensive military strategy is the source of this idiom."},
"目空一切":{breakdown:[{zh:"目空",m:"eyes see as empty"},{zh:"一切",m:"everything"}],literal:"Eyes that see everything as nothing",derivation:"So arrogant that nothing and no one is worthy of your regard"},
"逆水行舟":{breakdown:[{zh:"逆水",m:"against the current"},{zh:"行舟",m:"row a boat"}],literal:"Row a boat against the current",derivation:"If you stop paddling, the current carries you backward — constant effort is required or you fall behind"},
"宁死不屈":{breakdown:[{zh:"宁死",m:"would rather die"},{zh:"不屈",m:"than submit"}],literal:"Would rather die than bend",derivation:"The ultimate defiance — death is preferable to surrendering one's principles"},
"拍案叫绝":{breakdown:[{zh:"拍案",m:"slap the table"},{zh:"叫绝",m:"cry out 'superb!'"}],literal:"Slap the table and cry out in admiration",derivation:"So struck by something brilliant that you instinctively bang the table — visceral amazement"},
"蓬头垢面":{breakdown:[{zh:"蓬头",m:"dishevelled hair"},{zh:"垢面",m:"dirt-covered face"}],literal:"Wild hair and a dirty face",derivation:"A vivid physical description of someone unkempt — suggesting poverty or hardship"},
"破釜沉舟":{breakdown:[{zh:"破釜",m:"smash the cooking pots"},{zh:"沉舟",m:"sink the boats"}],literal:"Smash the pots, sink the boats",derivation:"From Xiang Yu who destroyed his army's means of retreat before battle — commit so completely there is no going back"},
"欺世盗名":{breakdown:[{zh:"欺世",m:"deceive the world"},{zh:"盗名",m:"steal a reputation"}],literal:"Deceive the world and steal a reputation",derivation:"Build fame through deception — your public image is a fraud"},
"千钧一发":{breakdown:[{zh:"千钧",m:"thirty thousand jin (enormous weight)"},{zh:"一发",m:"a single strand of hair"}],literal:"Thirty thousand jin hanging by a single hair",derivation:"An immense weight balanced on something as fragile as a hair — extreme, precarious danger",note:"钧是古代重量单位，一钧=三十斤。Each 钧 = 30 jin, so 千钧 = 30,000 jin — an almost incomprehensible weight. The contrast with a single hair (一发) is the entire point of this idiom."},
"前车之鉴":{breakdown:[{zh:"前车",m:"the cart ahead"},{zh:"之鉴",m:"serves as a mirror"}],literal:"The overturned cart ahead is your mirror",derivation:"Watch the cart in front topple and learn before your own cart reaches that spot"},
"前事不忘，后事之师":{breakdown:[{zh:"前事不忘",m:"do not forget past events"},{zh:"后事之师",m:"let them teach future events"}],literal:"Do not forget the past; let it teach the future",derivation:"History is the best instructor — remembering what went wrong equips you for what comes next"},
"潜移默化":{breakdown:[{zh:"潜移",m:"imperceptibly shift"},{zh:"默化",m:"silently transform"}],literal:"Imperceptibly shift, silently transform",derivation:"Change happens gradually and invisibly — you don't notice the influence until it has already shaped you"},
"巧夺天工":{breakdown:[{zh:"巧夺",m:"skill surpasses"},{zh:"天工",m:"the work of Heaven / nature"}],literal:"Craftsmanship that surpasses the work of nature itself",derivation:"Human artistry so exquisite it outdoes what nature could produce — the highest praise for workmanship"},
"青红皂白":{breakdown:[{zh:"青红",m:"blue and red"},{zh:"皂白",m:"black and white"}],literal:"Blue, red, black and white — all the colours mixed",derivation:"All colours together = the full picture; 不分青红皂白 = failing to distinguish right from wrong"},
"情同手足":{breakdown:[{zh:"情同",m:"feeling like"},{zh:"手足",m:"hands and feet"}],literal:"Bond as close as hands and feet",derivation:"Hands and feet are inseparable parts of one body — friendship so deep it feels like brotherhood"},
"人浮于事":{breakdown:[{zh:"人浮",m:"people float above"},{zh:"于事",m:"the work"}],literal:"People float above the work",derivation:"More staff than tasks to fill — overstaffed, with people having little to do"},
"人杰地灵":{breakdown:[{zh:"人杰",m:"outstanding people"},{zh:"地灵",m:"the land is spiritually gifted"}],literal:"Outstanding people, spiritually gifted land",derivation:"Greatness of person and place are intertwined — remarkable individuals emerge from remarkable places"},
"人尽其才":{breakdown:[{zh:"人尽",m:"every person fully"},{zh:"其才",m:"their own talent"}],literal:"Every person fully uses their own talent",derivation:"A well-ordered society where no talent is wasted"},
"人云亦云":{breakdown:[{zh:"人云",m:"others say"},{zh:"亦云",m:"I also say"}],literal:"Whatever others say, I also say",derivation:"Parrot what everyone else says without forming your own view"},
"如火如荼":{breakdown:[{zh:"如火",m:"like fire"},{zh:"如荼",m:"like white cogon flowers"}],literal:"Like fire, like white cogon flowers spreading across a field",derivation:"From a military description of a vast army — red banners like fire, white banners like cogon flowers. Now: intense energy spreading everywhere",note:"注意：荼≠茶！荼 (tú) is WHITE COGON GRASS FLOWER — NOT tea (茶, chá). The characters look similar and students frequently confuse them. This is a common exam error."},
"如释重负":{breakdown:[{zh:"如释",m:"as if released from"},{zh:"重负",m:"a heavy burden"}],literal:"As if a heavy burden has been released",derivation:"The relief and lightness felt when worry or responsibility lifts"},
"入木三分":{breakdown:[{zh:"入木",m:"penetrate into the wood"},{zh:"三分",m:"three fen deep"}],literal:"Penetrate three fen deep into the wood",derivation:"From Wang Xizhi whose calligraphy was so forceful it sank three fen into the wood beneath — analysis so incisive it cuts to the core",note:"出自书圣王羲之的故事。Wang Xizhi (王羲之) is considered the greatest calligrapher in Chinese history. Used ONLY for written or spoken analysis — not for physical penetration."},
"塞翁失马":{breakdown:[{zh:"塞翁",m:"the old man at the frontier"},{zh:"失马",m:"loses his horse"}],literal:"The frontier old man loses his horse",derivation:"His horse ran off but returned with a wild horse; his son broke his leg riding it; the injury saved him from conscription. Fortune and misfortune are unpredictable"},
"三思而行":{breakdown:[{zh:"三思",m:"think three times over"},{zh:"而行",m:"then act"}],literal:"Think three times, then act",derivation:"Deliberate carefully and repeatedly before committing to a course of action"},
"杀鸡取卵":{breakdown:[{zh:"杀鸡",m:"kill the hen"},{zh:"取卵",m:"take the eggs"}],literal:"Kill the hen to get the eggs",derivation:"Destroy the source of ongoing benefit for a one-time gain — sacrificing the future for immediate greed"},
"伤天害理":{breakdown:[{zh:"伤天",m:"wound Heaven"},{zh:"害理",m:"violate moral principle"}],literal:"Wound Heaven itself and violate all moral principle",derivation:"An act so cruel it offends the cosmic moral order — beyond ordinary wrongdoing"},
"舍己为人":{breakdown:[{zh:"舍己",m:"give up / sacrifice oneself"},{zh:"为人",m:"for the sake of others"}],literal:"Sacrifice oneself for the sake of others",derivation:"Place others' wellbeing entirely above your own — purest selfless altruism"},
"实事求是":{breakdown:[{zh:"实事",m:"actual facts / reality"},{zh:"求是",m:"seek what is true"}],literal:"From actual facts, seek what is true",derivation:"Base thinking and actions on reality — no wishful thinking, just honest engagement with facts"},
"事半功倍":{breakdown:[{zh:"事半",m:"half the effort"},{zh:"功倍",m:"double the result"}],literal:"Half the effort, double the result",derivation:"Work smart — the right method yields far more than brute effort alone"},
"视死如归":{breakdown:[{zh:"视死",m:"regard death"},{zh:"如归",m:"as returning home"}],literal:"Regard death as calmly as returning home",derivation:"Face mortal danger without fear — death holds no terror for those of true courage"},
"守望相助":{breakdown:[{zh:"守望",m:"watch over and guard"},{zh:"相助",m:"help each other"}],literal:"Watch over each other and help one another",derivation:"Neighbours take turns keeping watch and lending aid — mutual vigilance and support"},
"守株待兔":{breakdown:[{zh:"守株",m:"guard a tree stump"},{zh:"待兔",m:"wait for a rabbit"}],literal:"Guard the stump waiting for another rabbit to appear",derivation:"A farmer found a rabbit that knocked itself out on a stump, then waited there forever instead of farming — rely on luck, refuse to make real effort"},
"熟能生巧":{breakdown:[{zh:"熟",m:"proficiency through repetition"},{zh:"能生巧",m:"gives rise to skill"}],literal:"Proficiency gives rise to skill",derivation:"The more you practise, the more naturally your technique improves — mastery comes from repetition"},
"水到渠成":{breakdown:[{zh:"水到",m:"when the water arrives"},{zh:"渠成",m:"the channel forms naturally"}],literal:"When the water flows, the channel forms by itself",derivation:"When the right conditions accumulate, success follows naturally — you cannot force it but you can prepare"},
"水落石出":{breakdown:[{zh:"水落",m:"water recedes"},{zh:"石出",m:"stones emerge"}],literal:"Water recedes, and the stones beneath are revealed",derivation:"The truth eventually surfaces no matter how deeply buried"},
"司空见惯":{breakdown:[{zh:"司空",m:"the official Sikong (Minister of Works)"},{zh:"见惯",m:"grown accustomed to seeing"}],literal:"Even the Sikong official has grown used to seeing it",derivation:"From a Tang poem — the host so accustomed to lavish banquets nothing impresses him anymore",note:"司空是官职名，非人名。出自刘禹锡诗。司空 is an OFFICIAL TITLE (Minister of Works), not a person's name. From Liu Yuxi's Tang poem at a banquet hosted by Li Jian. The idiom means 'what even a high official is bored of' — so commonplace it no longer impresses anyone."},
"四面楚歌":{breakdown:[{zh:"四面",m:"on all four sides"},{zh:"楚歌",m:"songs of Chu"}],literal:"Songs of Chu rising from all four directions",derivation:"Xiang Yu's army heard Chu folk songs from every direction and believed their homeland had fallen — completely encircled, no ally in sight"},
"损人利己":{breakdown:[{zh:"损人",m:"harm others"},{zh:"利己",m:"benefit oneself"}],literal:"Harm others to benefit oneself",derivation:"Gain personal advantage at a direct cost to someone else — selfishness at its most destructive"},
"螳臂当车":{breakdown:[{zh:"螳臂",m:"a mantis's forelegs"},{zh:"当车",m:"block a carriage"}],literal:"A mantis raises its forelegs to stop an oncoming carriage",derivation:"From Zhuangzi — the mantis does not know its own weakness. Overestimate your strength and challenge an overwhelming force"},
"桃李满天下":{breakdown:[{zh:"桃李",m:"peaches and plums (metaphor for students)"},{zh:"满天下",m:"fill the world"}],literal:"Peaches and plums filling the world",derivation:"A teacher plants peach and plum saplings — students spread everywhere and flourish"},
"天渊之别":{breakdown:[{zh:"天",m:"sky / Heaven"},{zh:"渊",m:"deep abyss"},{zh:"之别",m:"the difference between"}],literal:"The difference between sky and abyss",derivation:"Heaven above and the deepest chasm below — two extremes as far apart as anything can be"},
"挑拨离间":{breakdown:[{zh:"挑拨",m:"stir up / provoke"},{zh:"离间",m:"drive a wedge between"}],literal:"Stir up trouble and drive people apart",derivation:"Deliberately plant seeds of suspicion and conflict to destroy trust between people"},
"铤而走险":{breakdown:[{zh:"铤",m:"move at desperate speed"},{zh:"而走险",m:"and take a dangerous path"}],literal:"Rush desperately down a dangerous path",derivation:"When cornered with no good options, take a reckless risk out of sheer desperation"},
"同甘共苦":{breakdown:[{zh:"同甘",m:"share the sweetness together"},{zh:"共苦",m:"endure the bitterness together"}],literal:"Share the sweet, endure the bitter — together",derivation:"True partnership means standing side by side through both good fortune and hardship"},
"同流合污":{breakdown:[{zh:"同流",m:"flow together with"},{zh:"合污",m:"join in the filth"}],literal:"Flow along with and join in the filth",derivation:"Rather than resisting corruption, you merge with it — go along until you are indistinguishable from it"},
"同心协力":{breakdown:[{zh:"同心",m:"united hearts"},{zh:"协力",m:"combined strength"}],literal:"United hearts, combined strength",derivation:"When everyone is aligned in purpose and pools effort, the difficult becomes achievable"},
"同舟共济":{breakdown:[{zh:"同舟",m:"in the same boat"},{zh:"共济",m:"cross the water together"}],literal:"In the same boat, cross together",derivation:"Even enemies put aside differences when their boat is in a storm — shared danger demands shared effort"},
"徒劳无功":{breakdown:[{zh:"徒劳",m:"labour in vain"},{zh:"无功",m:"no achievement"}],literal:"Labour in vain, achieve nothing",derivation:"Expend effort that produces no result whatsoever — wasted energy"},
"退避三舍":{breakdown:[{zh:"退避",m:"retreat and avoid"},{zh:"三舍",m:"ninety li (three days' march)"}],literal:"Retreat a full ninety li",derivation:"Duke Wen of Jin promised to withdraw ninety li if he ever faced his ally in battle — honour a debt by giving ground"},
"万古流芳":{breakdown:[{zh:"万古",m:"for ten thousand ages"},{zh:"流芳",m:"fragrance flows on"}],literal:"Fragrance flows on for ten thousand ages",derivation:"Like a beautiful scent that never fades — a great person's name and deeds remain admired forever"},
"万事俱备，只欠东风":{breakdown:[{zh:"万事俱备",m:"ten thousand things are all prepared"},{zh:"只欠东风",m:"only the east wind is missing"}],literal:"Everything is ready — only the east wind is lacking",derivation:"From the Battle of Red Cliffs — Zhuge Liang needed an east wind to launch the fire attack. All ready except one crucial element"},
"望尘莫及":{breakdown:[{zh:"望尘",m:"see only the dust left behind"},{zh:"莫及",m:"cannot reach"}],literal:"You can only see the dust they left behind",derivation:"So far ahead that all you see is the dust their departure stirred up — hopelessly outpaced"},
"忘恩负义":{breakdown:[{zh:"忘恩",m:"forget the kindness received"},{zh:"负义",m:"betray the obligation of gratitude"}],literal:"Forget the kindness, betray the obligation",derivation:"Receive someone's help and then act against them — the most basic failure of human decency"},
"危言耸听":{breakdown:[{zh:"危言",m:"alarming words"},{zh:"耸听",m:"make listeners' ears stand up in shock"}],literal:"Alarming words that make listeners' ears stand on end",derivation:"Deliberately exaggerate to frighten people — scaremongering designed to shock rather than inform"},
"为非作歹":{breakdown:[{zh:"为非",m:"do what is wrong"},{zh:"作歹",m:"commit what is wicked"}],literal:"Do wrong and commit wickedness",derivation:"Engage in all manner of bad and criminal behaviour without restraint"},
"为虎作伥":{breakdown:[{zh:"为虎",m:"for the tiger"},{zh:"作伥",m:"act as a chàng (ghost that guides the tiger to prey)"}],literal:"Become the tiger's chàng — its guide to victims",derivation:"Legend says those killed by a tiger become its ghostly servant, luring new victims — help a villain harm others",note:"伥是被虎所害之人的鬼魂，被迫为虎引路害人。The 伥 (chāng) cannot rest until the tiger kills again and a new ghost replaces it. The imagery is chilling: you help the very thing that destroyed you to destroy others."},
"未雨绸缪":{breakdown:[{zh:"未雨",m:"before the rain comes"},{zh:"绸缪",m:"bind and repair doors and windows"}],literal:"Repair your doors and windows before the rain arrives",derivation:"From the Book of Songs — a bird mends its nest before the storm. Prepare while conditions are still good"},
"温故知新":{breakdown:[{zh:"温故",m:"revisit the old"},{zh:"知新",m:"gain new understanding"}],literal:"Revisit the old and gain new understanding",derivation:"From Confucius — reviewing what you know with fresh eyes yields new insights; the mark of a true teacher"},
"温文尔雅":{breakdown:[{zh:"温文",m:"gentle and mild in manner"},{zh:"尔雅",m:"refined (as in the classical text 《尔雅》)"}],literal:"Gentle in manner, refined as the classics",derivation:"Behaviour so polished it reflects thorough cultivation — the ideal of a learned, well-mannered person",note:"尔雅指中国最早的词典《尔雅》。尔雅 references 《尔雅》, China's OLDEST surviving dictionary (c.3rd century BC), which defined classical refined language. To be 尔雅 means to embody classical standards."},
"闻鸡起舞":{breakdown:[{zh:"闻鸡",m:"hear the cockerel crow"},{zh:"起舞",m:"rise and practise swordsmanship"}],literal:"Hear the cockerel and rise to practise",derivation:"Zu Ti and Liu Kun trained at dawn whenever the cock crowed — no matter the hour. Disciplined self-improvement driven by ambition"},
"卧薪尝胆":{breakdown:[{zh:"卧薪",m:"sleep on brushwood"},{zh:"尝胆",m:"taste gall / bile daily"}],literal:"Sleep on rough brushwood, taste bitter gall each day",derivation:"King Goujian endured these hardships daily to keep his humiliation fresh and fuel his resolve — after 20 years he destroyed Wu",note:"越王勾践忍辱负重二十年，最终灭吴。One of the most complete revenge-and-restoration stories in Chinese history. The idiom encapsulates sustained, purposeful suffering as fuel for eventual triumph. High exam frequency."},
"乌合之众":{breakdown:[{zh:"乌合",m:"crows gathering chaotically"},{zh:"之众",m:"such a crowd"}],literal:"A crowd gathered like crows — chaotic and undisciplined",derivation:"Crows flock together noisily with no order — people assembled with no leadership or common purpose"},
"乌烟瘴气":{breakdown:[{zh:"乌烟",m:"black smoke"},{zh:"瘴气",m:"miasma / foul swamp vapour"}],literal:"Black smoke and foul miasma",derivation:"Originally described toxic swampland air — now any environment that is chaotic, corrupt, or morally polluted"},
"无可厚非":{breakdown:[{zh:"无可",m:"nothing to"},{zh:"厚非",m:"criticise heavily"}],literal:"Nothing about it deserves heavy criticism",derivation:"Not perfect, but not seriously wrong — minor faults not worth making a fuss over"},
"无微不至":{breakdown:[{zh:"无微",m:"no detail too small"},{zh:"不至",m:"not attended to"}],literal:"No detail too small to be attended to",derivation:"Care so thorough that even the tiniest needs are noticed and met"},
"五体投地":{breakdown:[{zh:"五体",m:"five body parts (hands, knees, forehead)"},{zh:"投地",m:"touch the ground"}],literal:"All five parts of the body prostrate on the ground",derivation:"The deepest Buddhist bow of total submission and reverence — utterly in awe"},
"相辅相成":{breakdown:[{zh:"相辅",m:"mutually assist"},{zh:"相成",m:"mutually complete"}],literal:"Mutually assist and mutually complete each other",derivation:"Two things that each make the other better — neither is sufficient alone, but together they are complete"},
"心猿意马":{breakdown:[{zh:"心猿",m:"mind like a monkey"},{zh:"意马",m:"thoughts like a wild horse"}],literal:"Mind like a restless monkey, thoughts like a wild horse",derivation:"A Buddhist metaphor for the untrained mind — leaps about like a monkey and bolts like a horse",note:"佛道两家的比喻，《西游记》中孙悟空即象征散乱的心猿。Appears in Journey to the West (《西游记》) where the Monkey King (孙悟空) is sometimes interpreted as an allegory for the unruly, untrained mind."},
"幸灾乐祸":{breakdown:[{zh:"幸灾",m:"delight in disaster"},{zh:"乐祸",m:"take pleasure in misfortune"}],literal:"Delight in disaster, take pleasure in others' misfortune",derivation:"Feel happiness at someone else's suffering — Schadenfreude"},
"袖手旁观":{breakdown:[{zh:"袖手",m:"hands tucked into sleeves"},{zh:"旁观",m:"watch from the side"}],literal:"Hands tucked in sleeves, watching from the sideline",derivation:"The posture of deliberate uninvolvement — stand by and do nothing while others struggle"},
"胸有成竹":{breakdown:[{zh:"胸有",m:"in the mind already holds"},{zh:"成竹",m:"a fully formed bamboo"}],literal:"Already holding a fully formed bamboo in the mind",derivation:"From painter Wen Tong who visualised the complete bamboo before touching brush to paper — have the full plan worked out before you begin",note:"出自画家文同的故事。Wen Tong said: 'When I paint bamboo I see the full bamboo, not individual sections.' The idiom is about mental preparedness — not confidence, but actual completed planning."},
"虚怀若谷":{breakdown:[{zh:"虚怀",m:"an empty / open heart"},{zh:"若谷",m:"like a valley"}],literal:"A heart as open and empty as a valley",derivation:"A valley holds everything poured into it — humility so deep you are always ready to receive others' ideas"},
"悬崖勒马":{breakdown:[{zh:"悬崖",m:"the edge of a cliff"},{zh:"勒马",m:"rein in the horse"}],literal:"Rein in the horse at the cliff's edge",derivation:"Pull back from disaster at the very last moment — recognise you are about to go over the edge and stop in time"},
"削足适履":{breakdown:[{zh:"削足",m:"shave down the foot"},{zh:"适履",m:"to fit the shoe"}],literal:"Cut down your foot to fit the shoe",derivation:"Force reality to fit a rigid constraint rather than finding the right fit — harmful and absurd"},
"雪中送炭":{breakdown:[{zh:"雪中",m:"in the midst of snow"},{zh:"送炭",m:"deliver charcoal"}],literal:"Deliver charcoal to someone in a snowstorm",derivation:"Give practical help precisely when it is most desperately needed — not a luxury but the one thing that enables survival"},
"循循善诱":{breakdown:[{zh:"循循",m:"step by step"},{zh:"善诱",m:"skilfully guide and lead"}],literal:"Step by step, skilfully guide and lead",derivation:"From Confucius's disciple Yan Hui praising his teacher — patient, methodical guidance that draws the student forward"},
"掩耳盗铃":{breakdown:[{zh:"掩耳",m:"cover one's own ears"},{zh:"盗铃",m:"steal a bell"}],literal:"Cover your own ears while stealing a bell",derivation:"A thief covered his ears so he couldn't hear the bell he was stealing — foolishly thinking concealment works when it obviously doesn't"},
"夜郎自大":{breakdown:[{zh:"夜郎",m:"Yelang (a small ancient kingdom)"},{zh:"自大",m:"consider itself great"}],literal:"The tiny kingdom of Yelang considers itself great",derivation:"The king of Yelang asked whether Han or Yelang was bigger — not knowing Han dwarfed his realm. Arrogance born of ignorance"},
"一败涂地":{breakdown:[{zh:"一败",m:"one defeat"},{zh:"涂地",m:"liver and brains smeared on the ground"}],literal:"One defeat — liver and brains smeared on the ground",derivation:"Originally described catastrophic battle casualties — now any utter, humiliating rout",note:"涂地原指肝脑涂地，形容极为惨烈的战败。The visceral original meaning — liver and brains splattered on the ground — explains why this idiom conveys such total, catastrophic defeat rather than simply losing."},
"一帆风顺":{breakdown:[{zh:"一帆",m:"a single sail"},{zh:"风顺",m:"favourable wind"}],literal:"One sail, a favourable wind",derivation:"The ideal sailing condition — wind behind you, sail full, nothing to impede. Everything going smoothly"},
"一鼓作气":{breakdown:[{zh:"一鼓",m:"the first drumbeat"},{zh:"作气",m:"summons the spirit"}],literal:"The first drumbeat summons the fighting spirit",derivation:"From Cao Gui — the first drum fires everyone up; by the third the energy is spent. Strike while momentum is at its peak",note:"出自《左传·曹刿论战》。Cao Gui's full strategy: wait until the ENEMY's third drum (when their energy is spent) before advancing. The idiom captures only the first half — the full wisdom is about timing fatigue."},
"一见如故":{breakdown:[{zh:"一见",m:"upon first meeting"},{zh:"如故",m:"as if old friends"}],literal:"Upon first meeting, feel like old friends",derivation:"An immediate, instinctive connection with someone you have just met"},
"一鸣惊人":{breakdown:[{zh:"一鸣",m:"one cry / call"},{zh:"惊人",m:"astonishes people"}],literal:"One cry, and everyone is astonished",derivation:"From King Zhuang of Chu who was silent for three years then ruled brilliantly — the silence was preparation, not laziness",note:"楚庄王三年不鸣，一鸣惊人。The key subtext: the three years of silence were deliberate preparation. The idiom implies the stunning performance was earned, not accidental."},
"一暴十寒":{breakdown:[{zh:"一暴",m:"one day of warmth / effort"},{zh:"十寒",m:"ten days of cold / neglect"}],literal:"One day of warmth, ten days of cold",derivation:"From Mencius — even the hardiest plant cannot survive one warm day followed by ten cold ones. Inconsistent effort overwhelmed by long stretches of laziness",note:"出自《孟子》。Mencius used this to describe inconsistent TEACHING — a student who sees his teacher once but is surrounded by bad influences the rest of the time cannot progress. About the ratio of good to bad influence, not just personal laziness."},
"一视同仁":{breakdown:[{zh:"一视",m:"look at with the same eye"},{zh:"同仁",m:"treat with equal benevolence"}],literal:"Look at all with the same eye, treat all with equal benevolence",derivation:"From Han Yu — a sage's love extends equally to all without favouritism"},
"一意孤行":{breakdown:[{zh:"一意",m:"one single intention"},{zh:"孤行",m:"go it alone"}],literal:"Fixed on one intention, going it alone",derivation:"Stubbornly follow your own course regardless of what anyone advises — closed to all counsel"},
"一针见血":{breakdown:[{zh:"一针",m:"one needle prick"},{zh:"见血",m:"draws blood immediately"}],literal:"One needle prick and blood appears at once",derivation:"Hit the precise point first time — a remark so accurate it goes straight to the core without wasted words"},
"以卵击石":{breakdown:[{zh:"以卵",m:"using an egg"},{zh:"击石",m:"strike a stone"}],literal:"Strike a stone with an egg",derivation:"The egg shatters while the stone is unmoved — challenge a vastly superior force with hopelessly inadequate means"},
"以身作则":{breakdown:[{zh:"以身",m:"with one's own conduct"},{zh:"作则",m:"set the standard"}],literal:"Use your own conduct to set the standard",derivation:"Lead by example rather than by instruction — your actions are the most powerful lesson"},
"以牙还牙":{breakdown:[{zh:"以牙",m:"with a tooth"},{zh:"还牙",m:"repay a tooth"}],literal:"Return a tooth for a tooth",derivation:"The ancient law of exact retaliation — repay harm with the identical harm"},
"因材施教":{breakdown:[{zh:"因材",m:"according to individual ability"},{zh:"施教",m:"deliver teaching"}],literal:"Deliver teaching according to each individual's ability",derivation:"From Confucius who gave different answers to the same question depending on who asked — tailor instruction to the learner"},
"饮水思源":{breakdown:[{zh:"饮水",m:"drink the water"},{zh:"思源",m:"think of its source"}],literal:"When you drink, think of where the water came from",derivation:"Never forget who or what made your current position possible — gratitude and awareness of one's roots"},
"迎刃而解":{breakdown:[{zh:"迎刃",m:"meeting the blade's edge"},{zh:"而解",m:"splits apart readily"}],literal:"Meet the blade and split apart at once",derivation:"Bamboo splits easily once the first section is cut — solve the key problem and the rest resolves itself naturally"},
"应接不暇":{breakdown:[{zh:"应接",m:"receive and attend to"},{zh:"不暇",m:"no time to spare"}],literal:"Receiving and attending to things — no time to spare",derivation:"Originally described beautiful scenery arriving faster than the eye could take in — now overwhelmed by too many demands"},
"与虎谋皮":{breakdown:[{zh:"与虎",m:"negotiate with a tiger"},{zh:"谋皮",m:"for its own skin"}],literal:"Ask a tiger to give up its own skin",derivation:"The tiger will never agree — ask someone to act against their own vital interests; a request that can never succeed"},
"与日俱增":{breakdown:[{zh:"与日",m:"with each passing day"},{zh:"俱增",m:"simultaneously increases"}],literal:"With each passing day, it increases alongside",derivation:"Grow steadily and continuously — not in sudden leaps but in a reliable, accumulating upward trend"},
"缘木求鱼":{breakdown:[{zh:"缘木",m:"climb a tree"},{zh:"求鱼",m:"look for fish"}],literal:"Climb a tree to look for fish",derivation:"From Mencius — fish live in water, not trees; no matter how skilled a climber, the method is entirely wrong"},
"约法三章":{breakdown:[{zh:"约法",m:"agree on rules"},{zh:"三章",m:"three articles"}],literal:"Agree on just three articles of law",derivation:"Liu Bang abolished harsh Qin laws and replaced them with just three rules — establish a small set of clear, mutually agreed rules",note:"刘邦入关中后约法三章：杀人者死，伤人及盗抵罪。This radical simplification won immediate popular support and is credited as key to Liu Bang's eventual victory over Xiang Yu. The three rules: kill → death; injure/steal → proportional punishment."},
"再接再厉":{breakdown:[{zh:"再接",m:"engage again"},{zh:"再厉",m:"sharpen again (on a whetstone)"}],literal:"Engage again, sharpen the blade again",derivation:"From cockfighting — a good cock sharpens its beak between bouts. Keep pressing forward, keep honing yourself",note:"注意：厉≠励！正确字为厉（磨砺），非励（鼓励）。The correct character is 厉 (sharpen a blade) — NOT 励 (encourage). Writing 再接再励 is a COMMON EXAM ERROR. The cockfighting origin confirms 厉 = sharpen on a whetstone."},
"真知灼见":{breakdown:[{zh:"真知",m:"genuine knowledge"},{zh:"灼见",m:"brilliant / burning insight"}],literal:"Genuine knowledge and brilliant insight",derivation:"灼 means burning-bright — insight so clear it shines like a flame; hard-won original understanding"},
"蒸蒸日上":{breakdown:[{zh:"蒸蒸",m:"rising steam (vigorous upward movement)"},{zh:"日上",m:"ascending day by day"}],literal:"Rising like steam, ascending day by day",derivation:"Steam rises continuously and unstoppably — steady, vigorous daily improvement"},
"执迷不悟":{breakdown:[{zh:"执迷",m:"cling stubbornly to delusion"},{zh:"不悟",m:"fail to awaken"}],literal:"Cling to delusion and fail to awaken",derivation:"A Buddhist framing — remain trapped in a wrong belief despite all attempts to show you the truth"},
"纸上谈兵":{breakdown:[{zh:"纸上",m:"on paper"},{zh:"谈兵",m:"discuss military strategy"}],literal:"Discuss battle strategy only on paper",derivation:"From Zhao Kuo who could quote every military text but led 400,000 soldiers to catastrophic defeat — theory without practice is worthless",note:"赵括纸上谈兵，长平之战损失四十万兵卒。The Battle of Changping (260 BC) was the LARGEST single military defeat in Chinese history — 400,000 soldiers lost. The idiom's weight comes from this catastrophic scale."},
"志同道合":{breakdown:[{zh:"志同",m:"same aspirations"},{zh:"道合",m:"aligned in principles"}],literal:"Same aspirations, aligned in the path you walk",derivation:"Not just sharing a goal but sharing the values and approach — deep compatibility of purpose and character"},
"志在四方":{breakdown:[{zh:"志在",m:"ambition directed at"},{zh:"四方",m:"all four directions / the whole world"}],literal:"Ambition pointed in all four directions",derivation:"A great person's aspirations are not confined to one place — look outward to the whole world"},
"州官放火":{breakdown:[{zh:"州官",m:"the district official"},{zh:"放火",m:"sets fires freely"}],literal:"The district official is free to set fires",derivation:"From the full proverb: officials may set fires but commoners may not even light lamps — those in power do as they please while forbidding the same to others"},
"装聋作哑":{breakdown:[{zh:"装聋",m:"pretend to be deaf"},{zh:"作哑",m:"act mute"}],literal:"Pretend to be deaf, act as if mute",derivation:"Deliberately feign ignorance of what you have clearly heard and seen — calculated non-response to avoid involvement"},
"自暴自弃":{breakdown:[{zh:"自暴",m:"abuse oneself"},{zh:"自弃",m:"abandon oneself"}],literal:"Abuse oneself and abandon oneself",derivation:"From Mencius — speaking against benevolence is self-abuse; acting against righteousness is self-abandonment. Give up on your own worth entirely",note:"出自《孟子》，原为严重的道德谴责。The Mencian original is far more serious than the modern meaning. 自暴 meant speaking against benevolence (a moral crime); 自弃 meant acting against righteousness. The modern 'give up on oneself' is a significant softening."},
"自食其力":{breakdown:[{zh:"自食",m:"feed oneself"},{zh:"其力",m:"by one's own effort"}],literal:"Feed yourself by your own effort",derivation:"Earn your own living through your own labour — the dignity and independence of self-sufficiency"},
"自投罗网":{breakdown:[{zh:"自投",m:"walk oneself into"},{zh:"罗网",m:"a net / trap"}],literal:"Walk yourself into the net",derivation:"Blunder into a trap through your own actions — caught by your own carelessness, not by cunning"},
"自相矛盾":{breakdown:[{zh:"自相",m:"within itself"},{zh:"矛盾",m:"spear and shield"}],literal:"The spear and shield contradict each other",derivation:"From a merchant who claimed his spear could pierce anything and his shield could block anything — asked what happens when you use one on the other",note:"矛盾一词即源于此故事，是汉语中'contradiction'的词源。This story is the direct ETYMOLOGICAL ORIGIN of the modern Chinese word 矛盾 (contradiction). Every time a Chinese person says 矛盾, they are invoking this story. One of the rare cases where an idiom lives on in everyday vocabulary."},
"作壁上观":{breakdown:[{zh:"作壁上观",m:"stand on the wall and watch the battle below"}],literal:"Climb the wall and watch the battle below",derivation:"From Xiang Yu's general who held back troops watching others fight — stay safely on the sidelines, uninvolved"},
"坐享其成":{breakdown:[{zh:"坐享",m:"sit and enjoy"},{zh:"其成",m:"what others have achieved"}],literal:"Sit and enjoy what others have worked to achieve",derivation:"Reap the rewards of other people's labour without contributing any effort — the ultimate free ride"}
};

var STORE_KEY='chengyu250_v1';
var _persist=true; // default on

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsRemove(k){try{localStorage.removeItem(k);}catch(e){}}

// Master store: {persist, starred:[], missCounts:{ch:n,...}, bestXP, bestPct, bestStreak}
function loadStore(){
  var raw=lsGet(STORE_KEY);
  if(!raw) return null;
  try{return JSON.parse(raw);}catch(e){return null;}
}
function saveStore(){
  if(!_persist) return;
  lsSet(STORE_KEY,JSON.stringify({
    persist:true,
    starred:Array.from(_starred),
    missCounts:_missCounts,
    bestXP:bestXP,bestPct:bestPct,bestStreak:bestStreak
  }));
}
function clearStore(){
  lsRemove(STORE_KEY);
}

// ── Starred ──────────────────────────────────────
var _starred=new Set(); // set of ch strings

function isStarred(ch){return _starred.has(ch);}
function toggleStar(ch){
  if(_starred.has(ch)) _starred.delete(ch); else _starred.add(ch);
  saveStore();
  updateCustomChips();
}

// ── Miss counts ───────────────────────────────────
var _missCounts={}; // {ch: totalMisses}

function recordMisses(missedArr){
  missedArr.forEach(function(m){
    _missCounts[m.ch]=(_missCounts[m.ch]||0)+1;
  });
  saveStore();
}
function getWeakIdioms(n){
  // Returns top-n most missed idioms as idiom objects
  var pairs=Object.keys(_missCounts).map(function(ch){
    return{ch:ch,count:_missCounts[ch]};
  });
  pairs.sort(function(a,b){return b.count-a.count;});
  var top=pairs.slice(0,n||20);
  return top.map(function(p){
    return IDIOMS.find(function(id){return id.ch===p.ch;});
  }).filter(Boolean);
}

// Only keep chs that exist in IDIOMS
TAGS=TAGS.map(function(t){
  return{label:t.label,en:t.en,chs:t.chs.filter(function(ch){
    return IDIOMS.some(function(id){return id.ch===ch;});
  })};
}).filter(function(t){return t.chs.length>0;});

var _activeTags=new Set(); // set of tag labels
var _poolMode='set'; // 'set' | 'topic'

function tagPool(){
  if(!_activeTags.size) return [];
  var set=new Set();
  TAGS.forEach(function(t){
    if(_activeTags.has(t.label)){
      t.chs.forEach(function(ch){
        var id=IDIOMS.find(function(x){return x.ch===ch;});
        if(id) set.add(id);
      });
    }
  });
  return Array.from(set);
}

function setPool(){
  var allCb=document.getElementById('all-sets-cb');
  if(allCb && allCb.checked) return IDIOMS.slice();
  var result=[];
  document.querySelectorAll('.set-cb input[type=checkbox]:not(#all-sets-cb)').forEach(function(cb){
    if(cb.checked){
      var s=parseInt(cb.dataset.start),e=parseInt(cb.dataset.end);
      IDIOMS.slice(s,e+1).forEach(function(id){
        if(!result.find(function(x){return x.ch===id.ch;})) result.push(id);
      });
    }
  });
  return result;
}

// ── Custom chips (starred / weak) ────────────────
var _useStarred=false;
var _useWeak=false;

function updateCustomChips(){
  var sc=document.getElementById('starred-count');
  var wc=document.getElementById('weak-count');
  if(sc) sc.textContent=_starred.size;
  if(wc) wc.textContent=Object.keys(_missCounts).length;
  var cs=document.getElementById('chip-starred');
  var cw=document.getElementById('chip-weak');
  if(cs) cs.classList.toggle('active',_useStarred);
  if(cw) cw.classList.toggle('active',_useWeak);
  updateSelSets();
}

// pool() — uses set OR topic+starred/weak depending on mode
function pool(){
  if(_poolMode==='set') return setPool();
  var base=tagPool();
  var baseSet=new Set(base.map(function(x){return x.ch;}));
  var extras=[];
  function addExtra(id){
    if(id&&!baseSet.has(id.ch)&&!extras.find(function(x){return x.ch===id.ch;})) extras.push(id);
  }
  if(_useStarred) _starred.forEach(function(ch){addExtra(IDIOMS.find(function(x){return x.ch===ch;}));});
  if(_useWeak) getWeakIdioms(20).forEach(addExtra);
  return base.concat(extras);
}

function renderTagGrid(){
  var grid=document.getElementById('tag-grid');
  if(!grid) return;
  grid.innerHTML=TAGS.map(function(t){
    var active=_activeTags.has(t.label)?'active':'';
    return '<div class="tag-chip '+active+'" data-tag="'+t.label+'">'+t.label
      +'<small style="display:block;font-size:10px;color:inherit;opacity:.8">'+t.en+' ('+t.chs.length+')</small></div>';
  }).join('');
  grid.querySelectorAll('.tag-chip').forEach(function(chip){
    chip.addEventListener('click',function(){
      var tag=this.dataset.tag;
      if(_activeTags.has(tag)) _activeTags.delete(tag); else _activeTags.add(tag);
      this.classList.toggle('active');
      updateSelSets();
    });
  });
}

function updateSelSets(){
  var allCb=document.getElementById('all-sets-cb');
  var setCbs=document.querySelectorAll('.set-cb input[type=checkbox]:not(#all-sets-cb)');
  if(allCb && allCb.checked) setCbs.forEach(function(c){c.checked=false;});
  var anySet=_poolMode==='set' && (Array.from(setCbs).some(function(c){return c.checked;}) || (allCb && allCb.checked));
  var anyTopic=_poolMode==='topic' && (_activeTags.size>0 || _useStarred || _useWeak);

  if(startBtn) startBtn.disabled=(!anySet&&!anyTopic)||selTypes.length===0;
}

  });
});

function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

function distractors(idiom,field,n){
  return shuffle(IDIOMS.filter(function(x){return x.ch!==idiom.ch;})).slice(0,n).map(function(x){return x[field];});
}
function usageDistractors(idiom,n){
  // Take example sentences from other idioms and inject the target idiom in place of their own idiom,
  // so all 4 options contain the target idiom — only the correct one uses it in its proper context.
  return shuffle(IDIOMS.filter(function(x){return x.ch!==idiom.ch&&x.example.indexOf(x.ch)>=0;})).slice(0,n).map(function(x){return x.example.replace(x.ch,idiom.ch);});
}

// Confusable pairs — idioms that are commonly mixed up
var CONFUSABLE_GROUPS=[
  ['半途而废','功败垂成','前功尽弃'],
  ['爱屋及乌','城门失火，殃及池鱼'],
  ['杯弓蛇影','草木皆兵'],
  ['对牛弹琴','班门弄斧'],
  ['画蛇添足','画龙点睛'],
  ['守株待兔','坐享其成'],
  ['滥竽充数','鱼目混珠'],
  ['狐假虎威','为虎作伥'],
  ['同流合污','狼狈为奸'],
  ['出尔反尔','自相矛盾'],
  ['沧海桑田','时过境迁'],
  ['塞翁失马','否极泰来'],
  ['一鸣惊人','出人头地'],
  ['废寝忘食','夜以继日'],
  ['见义勇为','当仁不让'],
  ['一视同仁','大公无私'],
  ['人云亦云','随波逐流'],
  ['孤注一掷','破釜沉舟'],
  ['不耻下问','虚怀若谷'],
  ['口是心非','阳奉阴违']
];
function findConfusable(idiom){
  for(var i=0;i<CONFUSABLE_GROUPS.length;i++){
    var g=CONFUSABLE_GROUPS[i];
    if(g.indexOf(idiom.ch)>=0){
      var others=g.filter(function(ch){return ch!==idiom.ch;});
      var result=others.map(function(ch){return IDIOMS.find(function(x){return x.ch===ch;});}).filter(Boolean);
      if(result.length>0)return result.slice(0,2);
    }
  }
  // fallback: pick a semantically-close random idiom
  return null;
}
function buildQ(p){
  var MAX_Q=12;
  var sample=shuffle(p.slice());
  var qs=[];
  sample.forEach(function(idiom){
    if(selTypes.indexOf('mc-meaning')>=0){
      var opts=shuffle([idiom.meaning].concat(distractors(idiom,'meaning',3)));
      qs.push({type:'mc-meaning',label:'选择题：根据成语选出正确意思',text:'"'+idiom.ch+'" 是什么意思？',opts:opts,ans:idiom.meaning,idiom:idiom});
    }
    if(selTypes.indexOf('mc-usage')>=0){
      var opts2=shuffle([idiom.example].concat(usageDistractors(idiom,3)));
      qs.push({type:'mc-usage',label:'选择题：哪个句子正确使用了该成语？',text:'以下哪个句子正确使用了 "'+idiom.ch+'"？',opts:opts2,ans:idiom.example,idiom:idiom});
    }
    if(selTypes.indexOf('fill-blank')>=0){
      qs.push({type:'fill',label:'填空题：根据上下文填入成语',text:idiom.example.replace(idiom.ch,'＿＿＿＿'),ans:idiom.ch,idiom:idiom});
    }
    if(selTypes.indexOf('mc-english')>=0){
      var enOpts=shuffle([idiom.ch].concat(distractors(idiom,'ch',3)));
      qs.push({type:'mc-english',label:'选择题：根据英文选出成语',text:'Which idiom matches this English meaning?\n\n"'+idiom.en+'"',opts:enOpts,ans:idiom.ch,idiom:idiom});
    }
    if(selTypes.indexOf('story-fill')>=0){
      var hint='（提示 Hint: '+idiom.en+'）';var storyText='【情景故事】\n\n'+hint+'\n\n请在横线上填入正确的成语：\n'+idiom.example.replace(idiom.ch,'___________');
      qs.push({type:'fill',label:'情景题：根据故事情节填入成语',text:storyText,ans:idiom.ch,idiom:idiom});
    }
    if(selTypes.indexOf('mc-confusable')>=0){
      var conf=findConfusable(idiom);
      if(conf){
        var confOpts=shuffle([idiom.meaning].concat(conf.map(function(x){return x.meaning;})));
        qs.push({type:'mc-confusable',label:'辨析题：选出"'+idiom.ch+'"的正确意思',text:'"'+idiom.ch+'" 还是 "'+conf.map(function(x){return x.ch;}).join('" / "')+'"?\n\n请选出【'+idiom.ch+'】的正确意思：',opts:confOpts,ans:idiom.meaning,idiom:idiom,confusables:conf});
      }
    }
  });
  var shuffled=shuffle(qs);
  return shuffled.slice(0,MAX_Q);
}

function buildQFromPool(p,maxQ){
  var sample=shuffle(p.slice());
  // If pool is tiny, repeat idioms to fill questions
  var expanded=[];
  while(expanded.length<maxQ*2) expanded=expanded.concat(sample);
  var qs=[];
  expanded.forEach(function(idiom){
    if(qs.length>=maxQ*3) return;
    if(selTypes.indexOf('mc-meaning')>=0){
      var opts=shuffle([idiom.meaning].concat(distractors(idiom,'meaning',3)));
      qs.push({type:'mc-meaning',label:'选择题：根据成语选出正确意思',text:'"'+idiom.ch+'" 是什么意思？',opts:opts,ans:idiom.meaning,idiom:idiom});
    }
    if(selTypes.indexOf('mc-usage')>=0){
      var opts2=shuffle([idiom.example].concat(usageDistractors(idiom,3)));
      qs.push({type:'mc-usage',label:'选择题：哪个句子正确使用了该成语？',text:'以下哪个句子正确使用了 "'+idiom.ch+'"？',opts:opts2,ans:idiom.example,idiom:idiom});
    }
    if(selTypes.indexOf('mc-english')>=0){
      var enOpts=shuffle([idiom.ch].concat(distractors(idiom,'ch',3)));
      qs.push({type:'mc-english',label:'选择题：根据英文选出成语',text:'Which idiom matches this English meaning?\n\n"'+idiom.en+'"',opts:enOpts,ans:idiom.ch,idiom:idiom});
    }
    if(selTypes.indexOf('mc-confusable')>=0){
      var conf=findConfusable(idiom);
      if(conf){
        var confOpts=shuffle([idiom.meaning].concat(conf.map(function(x){return x.meaning;})));
        qs.push({type:'mc-confusable',label:'辨析题：选出"'+idiom.ch+'"的正确意思',text:'"'+idiom.ch+'" 还是 "'+conf.map(function(x){return x.ch;}).join('" / "')+'\"?\n\n请选出【'+idiom.ch+'】的正确意思：',opts:confOpts,ans:idiom.meaning,idiom:idiom,confusables:conf});
      }
    }
    if(selTypes.indexOf('fill-blank')>=0){
      qs.push({type:'fill',label:'填空题：根据上下文填入成语',text:idiom.example.replace(idiom.ch,'＿＿＿＿'),ans:idiom.ch,idiom:idiom});
    }
    if(selTypes.indexOf('story-fill')>=0){
      var hint='（提示 Hint: '+idiom.en+'）';var storyText='【情景故事】\n\n'+hint+'\n\n请在横线上填入正确的成语：\n'+idiom.example.replace(idiom.ch,'___________');
      qs.push({type:'fill',label:'情景题：根据故事情节填入成语',text:storyText,ans:idiom.ch,idiom:idiom});
    }
  });
  return shuffle(qs).slice(0,maxQ);
}
function buildBreakdownHTML(meta, compact){

  var chars=meta.breakdown.map(function(c){

      ? '<div class="flip-back-bd-char"><div class="flip-back-bd-zh">'+c.zh+'</div><div class="flip-back-bd-m">'+c.m+'</div></div>'
      : '<div class="bd-char"><div class="bd-char-zh">'+c.zh+'</div><div class="bd-char-m">'+c.m+'</div></div>';
  }).join('');
  if(compact){
    var n=meta.note?'<div class="flip-back-bd-note"><b>💡</b> '+meta.note+'</div>':'';
    return '<div class="flip-back-bd">'
      +'<div class="flip-back-bd-title">字义 Breakdown</div>'
      +'<div class="flip-back-bd-chars">'+chars+'</div>'

    return '<div class="fb-breakdown">'

  }
}

      +'<div class="flip-back"><div class="flip-back-ch">'+id.ch+'</div>'
      +'<div class="flip-back-py">'+id.py+'</div>'
      +'<div class="flip-back-m">📖 '+id.meaning+'</div>'
      +'<div class="flip-back-en">🔤 '+id.en+'</div>'
      +'<div class="flip-back-ex">'+id.example+'</div>'
      +(function(){var meta=IDIOM_META[id.ch];return meta?buildBreakdownHTML(meta,true):'';}())
      +'</div></div></div>';
  }).join('');
  // Make back panels height auto so long content shows
  setTimeout(function(){
    grid.querySelectorAll('.flip-card').forEach(function(c){
      var back=c.querySelector('.flip-back');
      if(back&&back.scrollHeight>80) c.classList.add('tall');
    });
  },0);
}
function flipCard(card){
  var flipping=!card.classList.contains('flipped');
  card.classList.toggle('flipped');
  if(flipping){
    var back=card.querySelector('.flip-back');
    if(back){
      // Let the back render fully, then size the card to fit it
      setTimeout(function(){
        var h=back.scrollHeight;
        card.style.height=(h>80?h:80)+'px';
        card.querySelector('.flip-inner').style.height=(h>80?h:80)+'px';
      },10);
    }
  } else {
    card.style.height='80px';
    card.querySelector('.flip-inner').style.height='';
  }
}
var _allFlipped=false;
function flipAll(){
  var cards=document.querySelectorAll('#flip-grid .flip-card');
  _allFlipped=!_allFlipped;
  var btn=document.getElementById('flip-all-btn');
  if(_allFlipped){
    btn.textContent='收起全部 ▴';
    cards.forEach(function(card){
      if(!card.classList.contains('flipped')){
        card.classList.add('flipped');
        var back=card.querySelector('.flip-back');
        if(back){
          (function(c,b){setTimeout(function(){
            var h=b.scrollHeight;
            c.style.height=(h>80?h:80)+'px';
            c.querySelector('.flip-inner').style.height=(h>80?h:80)+'px';
          },10);}(card,back));
        }
      }
    });
  } else {
    btn.textContent='展开全部 ▾';
    cards.forEach(function(card){
      card.classList.remove('flipped');
      card.style.height='80px';
      var inner=card.querySelector('.flip-inner');
      if(inner) inner.style.height='';
    });
  }
}

// ── Glossary set filter ───────────────────────────────
function glossFilteredList(){
  var allCb=document.getElementById('gloss-all-cb');
  if(allCb && allCb.checked) return IDIOMS;
  var cbs=document.querySelectorAll('.gloss-cb');
  var result=[];
  cbs.forEach(function(cb){
    if(cb.checked){
      var s=parseInt(cb.dataset.start);
      var e=parseInt(cb.dataset.end);
      IDIOMS.forEach(function(id,i){if(i>=s&&i<=e) result.push(id);});
    }
  });
  return result;
}
function applyGlossFilter(){
  var q=document.getElementById('glossary-search').value.trim().toLowerCase();
  var base=glossFilteredList();
  if(!q){renderGlossary(base);return;}
  var filtered=base.filter(function(id){
    return id.ch.includes(q)||id.py.toLowerCase().includes(q)
      ||id.meaning.includes(q)||id.en.toLowerCase().includes(q);
  });
  renderGlossary(filtered);
}
document.addEventListener('change',function(e){
  var cb=e.target;
  if(!cb.classList.contains('gloss-cb') && cb.id!=='gloss-all-cb') return;
  var allCb=document.getElementById('gloss-all-cb');
  var indCbs=document.querySelectorAll('.gloss-cb');
  if(cb.id==='gloss-all-cb'){
    if(cb.checked) indCbs.forEach(function(c){c.checked=false;});
  } else {
    if(cb.checked && allCb) allCb.checked=false;
    var allInd=Array.from(indCbs).every(function(c){return c.checked;});
    if(allInd && allCb){
      allCb.checked=true;
      indCbs.forEach(function(c){c.checked=false;});
    }
  }
  applyGlossFilter();
});
document.addEventListener('DOMContentLoaded',function(){
  // ── Load persisted data ──────────────────────────
  var store=loadStore();
  if(store){
    _persist=store.persist!==false;
    if(store.starred) store.starred.forEach(function(ch){_starred.add(ch);});
    if(store.missCounts) _missCounts=store.missCounts;
    if(store.bestXP) bestXP=store.bestXP;
    if(store.bestPct) bestPct=store.bestPct;
    if(store.bestStreak) bestStreak=store.bestStreak;
  }
  renderPersistBar();
  renderTagGrid();
  updateCustomChips();

  // ── Persistence toggle ───────────────────────────
  document.getElementById('persist-toggle').addEventListener('click',function(){
    _persist=!_persist;
    if(!_persist) clearStore(); else saveStore();
    renderPersistBar();
  });

  // ── Custom pool chips ────────────────────────────
  document.getElementById('chip-starred').addEventListener('click',function(){
    _useStarred=!_useStarred;
    updateCustomChips();
  });
  document.getElementById('chip-weak').addEventListener('click',function(){
    _useWeak=!_useWeak;
    updateCustomChips();
  });

  document.getElementById('tab-set').addEventListener('click',function(){switchPoolTab('set');});
  document.getElementById('tab-topic').addEventListener('click',function(){switchPoolTab('topic');});

  $('glossary-btn').addEventListener('click',openGlossary);
  $('facts-btn').addEventListener('click',openFacts);
  $('facts-back-btn').addEventListener('click',goHome);
  $('glossary-back-btn').addEventListener('click',goHome);
  $('flip-all-btn').addEventListener('click',flipAll);
  $('glossary-search').addEventListener('input',function(){
    applyGlossFilter();
  });
});

</script>
